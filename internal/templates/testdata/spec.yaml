openapi: 3.0.3
info:
  title: Template coverage spec
  version: 1.0.0
paths:
  /things:
    get:
      operationId: listThings
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: perPage
          in: query
          schema: { type: integer }
        - name: X-Request-Id
          in: header
          schema: { type: string }
      responses:
        "200":
          description: paged things
          headers:
            X-Total:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Thing" }
    post:
      operationId: createThing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThing" }
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thing" }
        "422":
          description: validation failed
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
  /things/{id}:
    get:
      operationId: getThing
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: one thing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thing" }
        "404":
          description: missing
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetail" }
    patch:
      operationId: updateThing
      x-permission: things.write
      x-policy: things.owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateThing" }
      responses:
        "200":
          description: updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Thing" }
    delete:
      operationId: deleteThing
      x-policy: things.owner
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: gone
  /things/{id}/image:
    post:
      operationId: uploadThingImage
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "204":
          description: stored
components:
  schemas:
    Thing:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tags:
          type: array
          items: { type: string }
    CreateThing:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3 }
        tags:
          type: array
          items: { type: string }
    ProblemDetail:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              rule: { type: string }
              message: { type: string }
