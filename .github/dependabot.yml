version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      prefix-development: "build"
    groups:
      aws-sdk:
        patterns: ["github.com/aws/aws-sdk-go-v2*"]
      otel-sentry:
        patterns: ["github.com/getsentry/sentry-go*", "go.opentelemetry.io/*"]
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      npm-dev:
        patterns: ["*"]
